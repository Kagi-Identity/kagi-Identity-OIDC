<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kagi Identity — Callback</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#171717;background:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,640px);border:1px solid #ddd;padding:30px}
.brand{font-weight:750;letter-spacing:-.03em;font-size:13px;color:#666}.mark{display:inline-grid;place-items:center;width:25px;height:25px;background:#111;color:white;margin-right:8px}
h1{font-size:30px;letter-spacing:-.05em;margin:30px 0 12px}p{font-size:14px;line-height:1.8;color:#666;overflow-wrap:anywhere}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f6f6;padding:16px;font-size:12px;line-height:1.7}
a{color:#111}
</style></head>
<body><main><div class="brand"><span class="mark">K</span>Kagi Identity · RP callback</div><h1 id="title">コールバックを処理しています…</h1><p id="message">OAuth/OIDC の応答を検証しています。</p><pre id="output" hidden></pre><p><a href="/">← サンプルへ戻る</a></p></main>
<script>
(async function(){
  const title=document.getElementById('title'), message=document.getElementById('message'), output=document.getElementById('output');
  const params=new URLSearchParams(location.search);
  if(params.has('error')){title.textContent='認証に失敗しました';message.textContent=params.get('error_description')||params.get('error');return;}
  const issuer=sessionStorage.getItem('kagi-demo-issuer');
  const clientId=sessionStorage.getItem('kagi-demo-client-id');
  const redirectUri=location.origin+'/callback.html';
  if(!issuer||!clientId){title.textContent='設定が見つかりません';message.textContent='ログインを開始したタブでサンプルに戻り、接続設定を確認してください。';return;}
  try{
    const response=await fetch(issuer+'/static/kagi.js');
    if(!response.ok)throw new Error('SDK HTTP '+response.status);
    const script=document.createElement('script');script.textContent=await response.text();document.head.appendChild(script);
    Kagi.configure({issuer,clientId,redirectUri,scope:'openid profile email'});
    const session=await Kagi.handleCallback();
    const profile=await Kagi.userinfo();
    title.textContent='ログイン成功';
    message.textContent='コールバックが完了しました。表示する情報は必要最小限にしています。';
    output.hidden=false;output.textContent=JSON.stringify({subject:profile.sub,name:profile.name||null,email:profile.email||null,sessionType:typeof session},null,2);
  }catch(error){title.textContent='コールバック処理に失敗しました';message.textContent=error&&error.message?error.message:String(error);}
})();
</script></body></html>
