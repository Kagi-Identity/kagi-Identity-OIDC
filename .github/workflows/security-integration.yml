name: Security integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust format, lint, tests and release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile
        run: cargo check --all-targets
      - name: Unit tests
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Release build
        run: cargo build --release

  oauth-security-integration:
    name: OAuth/OIDC security regression tests
    runs-on: ubuntu-latest
    needs: rust
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install integration test dependencies
        run: python -m pip install --disable-pip-version-check requests cryptography
      - name: Build server
        run: cargo build --release
      - name: Start isolated test server
        env:
          KAGI_BIND: 127.0.0.1:8080
          KAGI_ISSUER: http://localhost:8080
          KAGI_DB: kagi-security-e2e.db
          KAGI_SEED_DEMO: "1"
          KAGI_ADMIN_TOKEN: test-admin
        run: |
          ./target/release/kagi > /tmp/kagi-security-test.log 2>&1 &
          echo $! > /tmp/kagi-security-test.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/healthz >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/kagi-security-test.pid)" 2>/dev/null; then
              cat /tmp/kagi-security-test.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/kagi-security-test.log
          exit 1
      - name: Authorization code race, DPoP replay, key rotation and metadata tests
        env:
          KAGI_BASE: http://localhost:8080
          KAGI_DB: kagi-security-e2e.db
          KAGI_ADMIN_TOKEN: test-admin
        run: python scripts/e2e_security_races.py
      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/kagi-security-test.log
      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/kagi-security-test.pid ]; then
            kill "$(cat /tmp/kagi-security-test.pid)" 2>/dev/null || true
          fi
