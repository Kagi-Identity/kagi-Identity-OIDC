[package]
name = "kagi"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "kagi — a passkey-first OpenID Connect provider (FAPI 2.0 profile)"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["form", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
base64 = "0.23"
sha2 = { version = "0.11", features = ["oid"] }
p256 = { version = "0.14", features = ["ecdsa"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = "0.10"
subtle = "2"
rsa = "0.9"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
